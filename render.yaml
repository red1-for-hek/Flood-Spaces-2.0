# Render blueprint — free, card-free deployment.
#
# The FREE plan needs no payment method. Two consequences:
#   1. The service sleeps after 15 minutes without traffic, which also pauses
#      Telegram polling and the 5-minute alert scheduler. Add a free uptime
#      monitor (UptimeRobot / cron-job.org) pinging /api/health every 5 minutes
#      to keep it awake 24/7.
#   2. Free services cannot mount a persistent disk, so the subscriber store
#      lives on the (ephemeral) service filesystem. It survives while the
#      service stays awake; a redeploy or a Render restart resets it and users
#      simply press Start in the bot again.
#
# Want guaranteed persistence? Change `plan` to `starter`, restore the disk
# block, and keep TELEGRAM_STATE_PATH on the mount path:
#
#   disk:
#     name: flood-spaces-data
#     mountPath: /opt/render/project/src/backend/data
#     sizeGB: 1
#
services:
  - type: web
    name: flood-spaces-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.2
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_STATE_PATH
        value: /opt/render/project/src/backend/data/telegram_store.json
      - key: ALERT_CHECK_INTERVAL_MINUTES
        value: "5"
      - key: ALERT_DEFAULT_THRESHOLD
        value: "50"
      - key: ALERT_RADIUS_KM
        value: "100"
      - key: FRONTEND_ORIGIN
        sync: false
